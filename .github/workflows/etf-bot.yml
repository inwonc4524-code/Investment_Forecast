name: ETF 추천 봇

on:
  schedule:
    # 한국시간 화~토 오전 7시 13분 (미국장 마감 직후, 한국장 전날 종가 반영)
    - cron: "13 22 * * 1-5"
    # 각 나라 장 마감 뒤 '오늘 많이 오른 ETF' 알림 (한국시간 월~금)
    - cron: "11 7 * * 1-5"    # 오후 4시 11분 — 한국장(3시 30분) 마감 뒤
    - cron: "37 7 * * 1-5"    # 오후 4시 37분 — 중국장(4시) 마감 뒤
    - cron: "23 8 * * 1-5"    # 오후 5시 23분 — 홍콩장(5시) 마감 뒤
  workflow_dispatch:      # Actions 화면에서 "Run workflow" 버튼으로 바로 실행
    inputs:
      close_market:
        description: "장 마감 알림을 다시 받으려면 나라를 고르세요 (비우면 아침 추천 알림)"
        required: false
        default: ""
        type: choice
        options: ["", "KR", "CN", "HK"]
  push:                   # 종목 목록이나 코드를 고치면 바로 한 번 실행
    branches: [main]
    paths: ["etf_bot.py", "newscard.py", "requirements.txt", "etfs.csv", "reasons.json", "crosscheck.py", ".github/workflows/etf-bot.yml", "pricecache.py"]

concurrency:            # 여러 번 겹쳐 실행되면 차례로 (저장할 때 부딪히지 않게)
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 받아 둔 가격 불러오기 (최근 1달만 새로 받아서 빠르게)
        uses: actions/cache@v4
        with:
          path: .pricecache
          key: prices-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: prices-

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: ETF 분석 + 휴대폰 알림
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CLOSE_MARKET: ${{ github.event.schedule == '11 7 * * 1-5' && 'KR' || github.event.schedule == '37 7 * * 1-5' && 'CN' || github.event.schedule == '23 8 * * 1-5' && 'HK' || inputs.close_market || '' }}
        run: python etf_bot.py

      - name: 대시보드 저장
        run: |
          git config user.name "etf-bot"
          git config user.email "etf-bot@users.noreply.github.com"
          git add docs
          git commit -m "ETF 대시보드 업데이트 $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git pull --rebase -X theirs origin main && git push
